<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Auth Test</title>
</head>
<body>
    <h1>Debug Auth Test</h1>
    
    <div>
        <h3>Current localStorage:</h3>
        <div id="storage-content"></div>
    </div>
    
    <div>
        <button onclick="clearStorage()">Clear All Storage</button>
        <button onclick="showStorage()">Show Storage</button>
        <button onclick="addTestData()">Add Test Data</button>
    </div>

    <script>
        function showStorage() {
            const storageDiv = document.getElementById('storage-content');
            const keys = Object.keys(localStorage);
            
            if (keys.length === 0) {
                storageDiv.innerHTML = '<p>localStorage is empty</p>';
                return;
            }
            
            let content = '<ul>';
            keys.forEach(key => {
                content += `<li><strong>${key}:</strong> ${localStorage.getItem(key)}</li>`;
            });
            content += '</ul>';
            
            storageDiv.innerHTML = content;
        }
        
        function clearStorage() {
            localStorage.clear();
            console.log('localStorage cleared');
            showStorage();
        }
        
        function addTestData() {
            localStorage.setItem('edulink_token', 'test_token_123');
            localStorage.setItem('edulink_user', JSON.stringify({
                id: 1,
                nombre: 'Test User',
                correo: 'test@test.com',
                role: 'estudiante'
            }));
            showStorage();
        }
        
        // Show initial state
        showStorage();
    </script>
</body>
</html>
