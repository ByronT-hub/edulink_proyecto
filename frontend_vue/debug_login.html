<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Login - EduLink</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .debug-section { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        input, button { padding: 10px; margin: 5px; width: 300px; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Debug Login - EduLink</h1>
    
    <div class="debug-section">
        <h3>🎯 Test Login</h3>
        <input type="email" id="correo" placeholder="Correo" value="osmar@gmail.com">
        <input type="password" id="contrasena" placeholder="Contraseña" value="12345678">
        <button onclick="testLogin()">🚀 Test Login</button>
    </div>

    <div class="debug-section">
        <h3>📊 Resultados</h3>
        <div id="results"></div>
    </div>

    <div class="debug-section">
        <h3>💾 LocalStorage</h3>
        <button onclick="checkLocalStorage()">📱 Check Storage</button>
        <button onclick="clearStorage()">🧹 Clear Storage</button>
        <div id="storage-info"></div>
    </div>

    <script>
        async function testLogin() {
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;
            const results = document.getElementById('results');
            
            results.innerHTML = '⏳ Testing login...';

            try {
                // Test 1: Direct API call
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ correo, contrasena })
                });

                const data = await response.json();
                
                if (response.ok) {
                    results.innerHTML = `
                        <div class="success">
                            <h4>✅ Login Exitoso</h4>
                            <p><strong>Usuario:</strong> ${data.user.nombre}</p>
                            <p><strong>Correo:</strong> ${data.user.correo}</p>
                            <p><strong>Rol:</strong> ${data.user.role}</p>
                            <p><strong>ID:</strong> ${data.user.id}</p>
                            <p><strong>Token:</strong> ${data.access_token.substring(0, 50)}...</p>
                            
                            <h5>🔍 Full Response:</h5>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;

                    // Test 2: Save to localStorage like the app does
                    localStorage.setItem('edulink_token', data.access_token);
                    localStorage.setItem('edulink_user', JSON.stringify(data.user));
                    
                    results.innerHTML += '<div class="success">💾 Datos guardados en localStorage</div>';
                } else {
                    results.innerHTML = `
                        <div class="error">
                            <h4>❌ Error en Login</h4>
                            <p>${data.message || 'Error desconocido'}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="error">
                        <h4>💥 Error de Conexión</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function checkLocalStorage() {
            const storageInfo = document.getElementById('storage-info');
            const token = localStorage.getItem('edulink_token');
            const user = localStorage.getItem('edulink_user');
            
            let userObj = null;
            try {
                userObj = user ? JSON.parse(user) : null;
            } catch (e) {
                userObj = 'Invalid JSON';
            }

            storageInfo.innerHTML = `
                <div class="debug-section">
                    <h4>📱 LocalStorage Status</h4>
                    <p><strong>Token exists:</strong> ${token ? '✅ Yes' : '❌ No'}</p>
                    <p><strong>User exists:</strong> ${user ? '✅ Yes' : '❌ No'}</p>
                    
                    ${user ? `
                        <h5>👤 User Data:</h5>
                        <pre>${JSON.stringify(userObj, null, 2)}</pre>
                        
                        <h5>🔑 Token Preview:</h5>
                        <p>${token ? token.substring(0, 100) + '...' : 'No token'}</p>
                    ` : ''}
                </div>
            `;
        }

        function clearStorage() {
            localStorage.removeItem('edulink_token');
            localStorage.removeItem('edulink_user');
            document.getElementById('storage-info').innerHTML = '<div class="success">🧹 Storage cleared</div>';
        }

        // Check storage on load
        checkLocalStorage();
    </script>
</body>
</html>
